<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>KBÜ Not Hesaplayıcı</title>
    <link rel="stylesheet" href="vize.css">
</head>

<body>

    <main class="container">
        <header>
            <h1>Not Hesaplayıcı</h1>
            <p>Vize, Final ve Bütünleme notlarınızı hesaplayın.</p>
        </header>

        <section class="form-section">
            <div class="form-grid">
                <div class="input-group">
                    <label for="vize">Vize / Ara Sınav Notu *</label>
                    <input type="number" id="vize" min="0" max="100" placeholder="Örn: 65">
                </div>

                <div class="input-group">
                    <label for="yil_ici">Yıl İçi Çalışma Puanı</label>
                    <input type="number" id="yil_ici" min="0" max="100" placeholder="Boş ise Vize notu alınır">
                </div>

                <div class="input-group">
                    <label for="final">Final Notu *</label>
                    <input type="number" id="final" min="0" max="100" placeholder="Örn: 55">
                </div>

                <div class="input-group">
                    <label for="butunleme">Bütünleme Notu</label>
                    <input type="number" id="butunleme" min="0" max="100" placeholder="Girilirse Final yerine geçer">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="devamsiz">
                    <label for="devamsiz">Devamsızım (F1 - Sınav hakkı yok)</label>
                </div>

                <div class="select-group full-width">
                    <label for="sinava_girdi">Genel/Bütünleme Sınavına Girdiniz mi?</label>
                    <select id="sinava_girdi">
                        <option value="evet">Evet, girdim</option>
                        <option value="hayir">Hayır, girmedim (F2)</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="hesapla_btn">Hesapla</button>
                <button id="sifirla_btn" class="outline">Sıfırla</button>
            </div>
        </section>

        <!-- Sonuç Kartı -->
        <section id="sonuc_alani" class="result-card hidden">
            <h2>Hesaplama Sonucu</h2>
            <ul>
                <li><span>Başarı Notu:</span> <strong id="res_basari">-</strong></li>
                <li><span>Harf Notu:</span> <strong id="res_harf">-</strong></li>
                <li><span>Durum:</span> <strong id="res_durum">-</strong></li>
            </ul>
            <div class="alert" id="res_aciklama"></div>
        </section>
    </main>

    <script src="hesapyap_Kopya.js"></script>
</body>

</html>
